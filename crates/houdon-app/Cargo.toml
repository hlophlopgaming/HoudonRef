[package]
name = "houdon-app"
description = "HoudonRef: anatomy atlas, 3D reference studio and timed drawing atelier for artists"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "houdon-app"

[dependencies]
houdon-core.workspace = true
houdon-i18n.workspace = true
houdon-render.workspace = true
eframe.workspace = true
egui.workspace = true
glam.workspace = true
log.workspace = true
serde = { version = "1", features = ["derive"] }
# Encodes exported pictures; already built for model textures.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
rfd = "0.17.2"
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "Document", "File", "FileList", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlInputElement", "Navigator", "Response", "Storage", "Url", "Window"] }
