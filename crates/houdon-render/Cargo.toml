[package]
name = "houdon-render"
description = "3D viewport rendering for HoudonRef (wgpu, WebGL2 feature level)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
houdon-core.workspace = true
bytemuck.workspace = true
egui.workspace = true
egui-wgpu = "0.37"
glam.workspace = true
log.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[dev-dependencies]
# Translates the shaders to GLSL ES 3.0, as wgpu does for WebGL2, so tests
# catch what only the browser would otherwise reject.
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }
